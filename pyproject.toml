[project]
name = "municipal-voiceai"
version = "0.1.0"
description = "Eval-gated German municipal voice AI with open speech models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30",
  "boto3>=1.35",
  "fastapi>=0.115",
  "grpcio>=1.66",
  "httpx>=0.27",
  "logfire>=3.0",
  "numpy>=2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-sdk>=1.30",
  "pgvector>=0.3.6",
  "pipecat-ai>=0.0.80",
  "prometheus-client>=0.21",
  "protobuf>=5.28",
  "pydantic>=2.10",
  "pydantic-ai>=1.0",
  "pydantic-settings>=2.6",
  "soundfile>=0.13",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
speech = [
  "librosa>=0.11",
  "torch>=2.6",
  "transformers>=4.50",
]
demo = [
    "pipecat-ai[aws-nova-sonic,webrtc]>=0.0.80",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/contracts", "services", "evals", "loadtest", "training"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]
# Lambda only opens fixed https:// URLs (Vercel API, demo /health).
"deploy/aws/control/handler.py" = ["S310"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["apps", "services", "packages", "evals", "loadtest", "training"]
exclude = [".venv", "apps/web/node_modules", "apps/web/.next"]
